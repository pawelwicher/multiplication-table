name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:run

      # Strona mieszka pod https://<użytkownik>.github.io/<repo>/, więc bez base-href
      # przeglądarka szukałaby skryptów w katalogu głównym domeny.
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # Bez tego pliku GitHub Pages przepuszcza wynik przez Jekylla.
      - run: touch dist/math-trainer/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/math-trainer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
